[project]
name = "cnc-fun"
version = "0.0.0"
license = {file = "LICENSE"}
authors = [
    { name = "Tathagata Chakraborti", email = "tchakra2@outlook.com" },
]
description = "Some fun with CnC data"
readme = "README.md"
requires-python = ">=3.13"

keywords = [
    "generative ai",
    "real-time strategy (rts)",
    "massively multiplayer online game"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pydantic :: 2",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pydantic",
    "openpyxl",
    "pydantic",
    "requests",
    "fastapi[standard]",
    "uvicorn[standard]",
    "certifi",
    "Pillow",
    "numpy"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "detect-secrets", "pre-commit"]

[project.urls]
"Repository" = "https://github.ibm.com/TathagataChakraborti/cnc-fun"
"Issues" = "https://github.com/TathagataChakraborti/cnc-fun/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cnc*"]

[tool.mypy]
python_version="3.13"
mypy_path = ""

show_column_numbers = true

# show error messages from unrelated files
follow_imports = "normal"

# be strict
disallow_untyped_calls = true
warn_return_any = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_optional = true

# Unreachable blocks have been an issue when compiling mypyc, let's try
# to avoid 'em in the first place.
warn_unreachable = true

# The following are off by default.  Flip them on if you feel adventurous.
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "I" # Enable the isort (I) rule category
]

ignore = [
    "B905" # ignore requiring `strict` to be specified when using `zip`
]

unfixable = [
    "B" # don't attempt to fix bugbear issues
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

no-sections = false

lines-between-types = 1
lines-after-imports = 2
